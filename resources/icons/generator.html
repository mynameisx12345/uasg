<!DOCTYPE html>
<html>
<head>
    <title>PWA Icon Generator</title>
</head>
<body>
    <h1>UASG PWA Icon Generator</h1>
    <p>This will generate placeholder icons for the PWA. In production, replace with proper icons.</p>
    
    <canvas id="iconCanvas" width="512" height="512" style="border: 1px solid #ccc;"></canvas>
    <br><br>
    <button onclick="generateIcons()">Generate All Icons</button>
    <div id="downloadLinks"></div>

    <script>
        function generateIcon(size, text, bgColor = '#2196F3', textColor = '#ffffff') {
            const canvas = document.createElement('canvas');
            canvas.width = size;
            canvas.height = size;
            const ctx = canvas.getContext('2d');
            
            // Background
            ctx.fillStyle = bgColor;
            ctx.fillRect(0, 0, size, size);
            
            // Text
            ctx.fillStyle = textColor;
            ctx.font = `bold ${size * 0.3}px Arial`;
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText(text, size / 2, size / 2);
            
            return canvas.toDataURL('image/png');
        }
        
        function downloadImage(dataUrl, filename) {
            const link = document.createElement('a');
            link.download = filename;
            link.href = dataUrl;
            link.textContent = `Download ${filename}`;
            link.style.display = 'block';
            link.style.marginBottom = '5px';
            document.getElementById('downloadLinks').appendChild(link);
        }
        
        function generateIcons() {
            const sizes = [72, 96, 128, 144, 152, 192, 384, 512];
            const text = 'UASG';
            
            document.getElementById('downloadLinks').innerHTML = '';
            
            sizes.forEach(size => {
                const dataUrl = generateIcon(size, text);
                downloadImage(dataUrl, `icon-${size}x${size}.png`);
            });
            
            // Show preview
            const preview = generateIcon(512, text);
            const previewCanvas = document.getElementById('iconCanvas');
            const ctx = previewCanvas.getContext('2d');
            const img = new Image();
            img.onload = () => {
                ctx.drawImage(img, 0, 0);
            };
            img.src = preview;
        }
    </script>
</body>
</html>
